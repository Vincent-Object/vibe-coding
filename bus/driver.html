<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公交车驾驶员 - 小朋友乐园</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111;
  overflow: hidden;
  font-family: 'SF Pro Display','Segoe UI',system-ui,sans-serif;
}
#driveView {
  position: fixed;
  inset: 0;
  background: #111;
}
#driveCanvas {
  width: 100%;
  height: 100%;
}
.drive-back-btn {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 8px 22px;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: all 0.2s;
  text-decoration: none;
}
.drive-back-btn:hover {
  background: rgba(255,255,255,0.2);
}
</style>
<style>
.hud-speed {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
  padding: 10px 20px;
  color: #fff;
  backdrop-filter: blur(8px);
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.12);
  display: none;
}
.hud-speed .label { font-size: 11px; opacity: 0.6; letter-spacing: 2px; }
.hud-speed .value { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.hud-speed .unit { font-size: 13px; font-weight: 400; margin-left: 4px; }
.hud-dist {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
  padding: 10px 20px;
  color: #fff;
  backdrop-filter: blur(8px);
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.12);
  display: none;
}
.hud-dist .label { font-size: 11px; opacity: 0.6; letter-spacing: 2px; }
.hud-dist .value { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.hud-dist .unit { font-size: 13px; font-weight: 400; margin-left: 4px; }
.hud-fork {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg,rgba(255,152,0,0.9),rgba(255,87,34,0.9));
  color: #fff;
  padding: 12px 32px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 800;
  z-index: 10;
  box-shadow: 0 4px 24px rgba(255,152,0,0.5);
  animation: fp .6s ease-in-out infinite alternate;
  display: none;
}
.touch-controls {
  position: absolute;
  bottom: 18px;
  left: 18px;
  z-index: 10;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.touch-btn {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.4);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
.touch-btn-gas { background: rgba(76,175,80,0.35); }
.touch-btn-brake { background: rgba(244,67,54,0.35); }
.touch-row { display: flex; gap: 6px; }
.start-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,rgba(0,0,0,0.2),rgba(0,0,0,0.75));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  color: #fff;
  gap: 16px;
}
.start-overlay .title {
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 4px 30px rgba(33,150,243,0.7);
  color: #64B5F6;
}
.start-overlay .instructions {
  font-size: 15px;
  opacity: 0.85;
  text-align: center;
  line-height: 2.0;
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 28px;
}
.start-overlay .start-btn {
  margin-top: 6px;
  padding: 14px 56px;
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg,#1565C0,#42A5F5);
  color: #fff;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(33,150,243,0.5);
  letter-spacing: 2px;
}
.hud-ramp {
  top: 28%;
  background: linear-gradient(135deg,rgba(33,150,243,0.92),rgba(0,188,212,0.92));
  box-shadow: 0 4px 24px rgba(33,150,243,0.55);
}
@keyframes fp {
  from { opacity: .85; transform: translateX(-50%) scale(.97); }
  to { opacity: 1; transform: translateX(-50%) scale(1.04); }
}
</style>
</head>
<body>
<div id="driveView">
  <div id="driveCanvas"></div>
  <a class="drive-back-btn" href="index.html">⬅ 返回管理站</a>
  <div class="hud-speed" id="hudSpeed">
    <div class="label">速度</div>
    <div><span class="value" id="hudSpeedVal">0</span><span class="unit">km/h</span></div>
  </div>
  <div class="hud-dist" id="hudDist">
    <div class="label">里程</div>
    <div><span class="value" id="hudDistVal">0</span><span class="unit">m</span></div>
  </div>
  <div class="hud-fork" id="hudFork">⚠️ 前方分叉路口！</div>
  <div class="hud-fork hud-ramp" id="hudRamp">🌉 按 ➡ 开上高架桥！</div>
  <div class="touch-controls" id="touchControls">
    <div class="touch-btn touch-btn-gas" id="btnGas">▲</div>
    <div class="touch-row">
      <div class="touch-btn" id="btnLeft">◀</div>
      <div class="touch-btn touch-btn-brake" id="btnBrake">▼</div>
      <div class="touch-btn" id="btnRight">▶</div>
    </div>
  </div>
  <div class="start-overlay" id="startOverlay">
    <div class="title" id="gameTitle">🚌 公交车驾驶员</div>
    <div class="instructions">
      <b style="color:#81D4FA">⬆ W</b> 加速 &nbsp;&nbsp; <b style="color:#EF9A9A">⬇ S</b> 刹车<br>
      <b style="color:#A5D6A7">⬅ A</b> 左转 &nbsp;&nbsp; <b style="color:#FFE082">➡ D</b> 右转<br>
      遇到路口选择方向！触屏可用左下角按钮<br>
      <b style="color:#4FC3F7">🌉 看到右边的高架桥入口，按 ➡ 就能开上去看风景！</b>
    </div>
    <button class="start-btn" id="startDriveBtn">出发 🚌</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   公交车驾驶游戏 (从 bus-game.jsx 转换为原生JS)
   ═══════════════════════════════════════════════ */
var ROAD_W = 13;
var SIDEWALK_W = 3;
var TILE_LEN = 12;
var POOL = 60;

/* ═══ 立交桥/高架桥 参数 ═══ */
var DECK_H = 8.0;          // 桥面高度
var DECK_W = 9;            // 桥面宽度（巡航段）
var RAMP_W = 6;            // 匝道宽度
var RAMP_LEN = 46;         // 上/下匝道长度（沿 Z）
var CRUISE_LEN = 150;      // 高架巡航段长度
var ENTRY_X = ROAD_W / 2;  // 匝道入口在道路右侧

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function smooth(t) { return t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t); }

/* 立交桥中心线高度（公交车应处的 y）。z 沿行驶方向递减。 */
function deckHeight(o, z) {
  if (z > o.zStart || z < o.zEnd) return 0;
  if (z > o.zClimbEnd) { var t = (o.zStart - z) / RAMP_LEN; return DECK_H * t; }
  if (z > o.zCruiseEnd) return DECK_H;
  var t2 = (o.zCruiseEnd - z) / RAMP_LEN; return DECK_H * (1 - t2);
}
/* 立交桥中心线横向位置：入口从右侧匝道平滑汇入桥面中央，出口再平滑回到右侧。 */
function deckX(o, z) {
  if (z > o.zStart || z < o.zEnd) return ENTRY_X;
  if (z > o.zClimbEnd) { var t = (o.zStart - z) / RAMP_LEN; return ENTRY_X * (1 - smooth(t)); }
  if (z > o.zCruiseEnd) return 0;
  var t2 = (o.zCruiseEnd - z) / RAMP_LEN; return ENTRY_X * smooth(t2);
}

// Helper: create mesh and set position (Object.assign can't overwrite .position in r128)
function mp(mesh, x, y, z) { mesh.position.set(x, y, z); return mesh; }

/* ═══ BUS MODEL ═══ */
function makeBus() {
  var g = new THREE.Group();
  var m = function(c) { return new THREE.MeshLambertMaterial({ color: c }); };
  var gl = function(c, o) { return new THREE.MeshLambertMaterial({ color: c, transparent: true, opacity: o || 0.45 }); };
  // chassis
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.8, 9), m(0x1565C0)), 0, 0.8, 0));
  // upper body
  var upper = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 8.8), m(0x1E88E5));
  upper.position.y = 2.3; upper.castShadow = true; g.add(upper);
  // roof
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.2, 8.4), m(0x0D47A1)), 0, 3.5, 0));
  // windshield
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.6, 0.1), gl(0x90CAF9)), 0, 2.5, -4.5));
  // rear window
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.2, 0.1), gl(0x90CAF9)), 0, 2.6, 4.5));
  // side windows
  for (var s = -1; s <= 1; s += 2)
    for (var i = -3.2; i <= 3.2; i += 1.6)
      g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 1.1), gl(0xBBDEFB, 0.5)), s * 1.65, 2.6, i));
  // wheels
  var wG = new THREE.CylinderGeometry(0.52, 0.52, 0.45, 14);
  var wM = m(0x222222);
  var wP = [[-1.7, 0.52, -3.2], [1.7, 0.52, -3.2], [-1.7, 0.52, 3.2], [1.7, 0.52, 3.2]];
  var wheels = [];
  wP.forEach(function(p) {
    var wh = new THREE.Mesh(wG, wM); wh.rotation.z = Math.PI / 2;
    wh.position.set(p[0], p[1], p[2]); g.add(wh); wheels.push(wh);
    var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.46, 8), m(0x999999));
    hub.rotation.z = Math.PI / 2; hub.position.set(p[0], p[1], p[2]); g.add(hub);
  });
  // headlights
  [-1, 1].forEach(function(hs) {
    g.add(mp(new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 8), new THREE.MeshBasicMaterial({ color: 0xFFF9C4 })), hs * 1.1, 1.3, -4.55));
  });
  // taillights
  [-1, 1].forEach(function(ts) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.35, 0.1), new THREE.MeshBasicMaterial({ color: 0xff1744 })), ts * 1.1, 1.3, 4.55));
  });
  // bumper
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.45, 0.3), m(0xBDBDBD)), 0, 0.6, -4.6));
  // route sign
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 0.08), m(0xFF8F00)), 0, 3.65, -4.3));
  g.userData.wheels = wheels;
  return g;
}

/* ═══ SCENERY FACTORIES ═══ */
function makeTree() {
  var g = new THREE.Group();
  var h = rand(3, 7);
  g.add(mp(new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, h * 0.45, 6), new THREE.MeshLambertMaterial({ color: 0x6D4C41 })), 0, h * 0.22, 0));
  g.add(mp(new THREE.Mesh(new THREE.CylinderGeometry(0, rand(1.5, 3), h * 0.65, 7), new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(rand(0.25, 0.4), 0.7, rand(0.3, 0.5)) })), 0, h * 0.65, 0));
  return g;
}

function makeBuilding() {
  var g = new THREE.Group();
  var h = rand(6, 22), w = rand(5, 12), d = rand(5, 10);
  var body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(rand(0, 1), rand(0.15, 0.5), rand(0.5, 0.75)) }));
  body.position.y = h / 2; body.castShadow = true; g.add(body);
  var winM = new THREE.MeshBasicMaterial({ color: 0xFFF9C4 });
  for (var wy = 2; wy < h - 1; wy += 2.2)
    for (var wx = -w / 2 + 1.2; wx < w / 2 - 0.5; wx += 1.8)
      if (Math.random() > 0.3) g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.1), winM), wx, wy, d / 2 + 0.06));
  return g;
}

function makePole() {
  var g = new THREE.Group();
  g.add(mp(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5, 6), new THREE.MeshLambertMaterial({ color: 0x78909C })), 0, 2.5, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.08), new THREE.MeshLambertMaterial({ color: 0x78909C })), -0.9, 4.9, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.3), new THREE.MeshBasicMaterial({ color: 0xFFEE58 })), -1.8, 4.8, 0));
  return g;
}

function makeMarker() {
  var g = new THREE.Group();
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 0.15), new THREE.MeshLambertMaterial({ color: 0xffffff })), 0, 0.5, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 0.18), new THREE.MeshBasicMaterial({ color: 0xff5722 })), 0, 0.85, 0));
  return g;
}

function makeBusStop() {
  var g = new THREE.Group();
  var sm = function(c) { return new THREE.MeshLambertMaterial({ color: c }); };
  var gm = new THREE.MeshLambertMaterial({ color: 0xBBDEFB, transparent: true, opacity: 0.42 });
  var sW = 4.0, sH = 2.8, sD = 1.6;
  // Front poles (road-facing side, X=0 in group space)
  [-sW/2 + 0.25, sW/2 - 0.25].forEach(function(z) {
    g.add(mp(new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, sH, 6), sm(0x90A4AE)), 0, sH/2, z));
  });
  // Roof canopy (blue)
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(sD + 0.5, 0.16, sW + 0.4), sm(0x1565C0)), sD/2, sH + 0.08, 0));
  // Back wall glass (at X=sD)
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.07, sH - 0.15, sW), gm), sD, sH/2, 0));
  // Side glass panels
  [-sW/2, sW/2].forEach(function(z) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(sD, sH - 0.35, 0.07), gm), sD/2, sH/2, z));
  });
  // Bench seat
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.1, sW - 0.6), sm(0x795548)), sD - 0.22, 1.05, 0));
  // Bench legs
  [-sW/2 + 0.45, sW/2 - 0.45].forEach(function(z) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.95, 0.08), sm(0x555555)), sD - 0.22, 0.52, z));
  });
  // Sign pole (at one end)
  var signZ = sW/2 + 0.55;
  g.add(mp(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.8, 6), sm(0x607D8B)), 0, 1.9, signZ));
  // Sign board (orange)
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.85, 0.85), sm(0xF57C00)), 0, 3.72, signZ));
  // White icon on sign
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.45, 0.45), new THREE.MeshBasicMaterial({ color: 0xffffff })), 0.06, 3.72, signZ));
  return g;
}

function makePassenger() {
  var g = new THREE.Group();
  var palette = [0xFF8A65, 0xF48FB1, 0x90CAF9, 0xA5D6A7, 0xFFE082, 0xCE93D8, 0x80DEEA];
  var bodyColor = palette[Math.floor(Math.random() * palette.length)];
  var sm = function(c) { return new THREE.MeshLambertMaterial({ color: c }); };
  g.add(mp(new THREE.Mesh(new THREE.SphereGeometry(0.22, 7, 7), sm(0xFFCC80)), 0, 1.62, 0));
  g.add(mp(new THREE.Mesh(new THREE.SphereGeometry(0.23, 7, 5), sm(Math.random() > 0.5 ? 0x3E2723 : 0xFDD835)), 0, 1.79, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.55, 0.2), sm(bodyColor)), 0, 1.1, 0));
  [-0.1, 0.1].forEach(function(x) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.52, 0.17), sm(0x37474F)), x, 0.62, 0));
  });
  [-0.26, 0.26].forEach(function(x) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.44, 0.14), sm(bodyColor)), x, 1.1, 0));
  });
  g.scale.set(0.85, 0.85, 0.85);
  return g;
}

/* ═══ NPC VEHICLES ═══ */
function makeCar() {
  var g = new THREE.Group();
  var cols = [0xE53935, 0x1E88E5, 0x43A047, 0xFFB300, 0x8E24AA, 0xF4511E, 0xEEEEEE, 0x212121, 0x00838F];
  var col = cols[Math.floor(Math.random() * cols.length)];
  var m = function(c) { return new THREE.MeshLambertMaterial({ color: c }); };
  var gl = new THREE.MeshLambertMaterial({ color: 0xB3E5FC, transparent: true, opacity: 0.5 });
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.58, 4.4), m(col)), 0, 0.55, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.72, 2.4), m(col)), 0, 1.26, 0.1));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.58, 0.07), gl), 0, 1.26, -1.28));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.58, 0.07), gl), 0, 1.26, 1.31));
  [[-1.0, 0.4, -1.5], [1.0, 0.4, -1.5], [-1.0, 0.4, 1.5], [1.0, 0.4, 1.5]].forEach(function(p) {
    var w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 10), m(0x222222));
    w.rotation.z = Math.PI / 2; w.position.set(p[0], p[1], p[2]); g.add(w);
  });
  [-0.6, 0.6].forEach(function(x) {
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.07), new THREE.MeshBasicMaterial({ color: 0xFFF9C4 })), x, 0.7, -2.25));
    g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.07), new THREE.MeshBasicMaterial({ color: 0xFF1744 })), x, 0.7, 2.25));
  });
  return g;
}

function makeRouteSign(routeNum) {
  var canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 48;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FF8F00';
  ctx.fillRect(0, 0, 128, 48);
  ctx.fillStyle = '#CC0000';
  ctx.font = 'bold 30px Arial, "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Pre-mirror so it reads correctly after the bus rotation.y = Math.PI flip
  ctx.save();
  ctx.translate(128, 0);
  ctx.scale(-1, 1);
  ctx.fillText(String(routeNum), 64, 26);
  ctx.restore();
  var tex = new THREE.CanvasTexture(canvas);
  var sign = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.75),
    new THREE.MeshBasicMaterial({ map: tex }));
  sign.rotation.y = Math.PI; // canonical front face faces world +Z (toward player)
  sign.position.set(0, 3.48, -4.0); // front-top of bus in local coords
  return sign;
}

function makeNPCBus(routeNum) {
  var g = new THREE.Group();
  var cols = [0xC62828, 0x00695C, 0x283593, 0xE65100, 0x4A148C];
  var col = cols[Math.floor(Math.random() * cols.length)];
  var m = function(c) { return new THREE.MeshLambertMaterial({ color: c }); };
  var gl = new THREE.MeshLambertMaterial({ color: 0x90CAF9, transparent: true, opacity: 0.45 });
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.72, 8.8), m(col)), 0, 0.7, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(3.0, 2.1, 8.6), m(col)), 0, 2.15, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.16, 8.2), m(0x0D47A1)), 0, 3.3, 0));
  g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.5, 0.07), gl), 0, 2.3, -4.4));
  for (var s = -1; s <= 1; s += 2)
    for (var i = -3.0; i <= 3.0; i += 1.5)
      g.add(mp(new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.0, 1.1), gl), s * 1.57, 2.3, i));
  [[-1.55, 0.52, -3.0], [1.55, 0.52, -3.0], [-1.55, 0.52, 3.0], [1.55, 0.52, 3.0]].forEach(function(p) {

/* ═══ INIT GAME ═══ */
function initGame() {
  var el = document.getElementById('driveCanvas');
  var W = el.clientWidth, H = el.clientHeight;

  // Scene
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7EC8E3);
  scene.fog = new THREE.Fog(0x7EC8E3, 100, 380);

  var camera = new THREE.PerspectiveCamera(58, W / H, 0.5, 500);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  el.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var sun = new THREE.DirectionalLight(0xffeedd, 1.0);
  sun.position.set(60, 120, -40); sun.castShadow = true;
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x87CEEB, 0x558B2F, 0.35));

  // Ground
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: 0x558B2F }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true;
  scene.add(ground);

  // Materials
  var roadMat = new THREE.MeshLambertMaterial({ color: 0x37474F });
  var swMat = new THREE.MeshLambertMaterial({ color: 0x9E9E9E });
  var curbMat = new THREE.MeshLambertMaterial({ color: 0xBDBDBD });
  var dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var edgeMat = new THREE.MeshBasicMaterial({ color: 0xFFD600 });

  // ── 立交桥/高架桥 builder ──
  var ovDeckMat = new THREE.MeshLambertMaterial({ color: 0x455A64 });
  var ovConcreteMat = new THREE.MeshLambertMaterial({ color: 0xB0BEC5 });
  var ovRailMat = new THREE.MeshLambertMaterial({ color: 0xCFD8DC });
  var ovArrowMat = new THREE.MeshBasicMaterial({ color: 0x4CAF50 });

  function buildOverpass(zStart) {
    var o = { zStart: zStart };
    o.zClimbEnd = zStart - RAMP_LEN;
    o.zCruiseEnd = o.zClimbEnd - CRUISE_LEN;
    o.zEnd = o.zCruiseEnd - RAMP_LEN;
    var g = new THREE.Group();

    // 匝道（分段跟随 deckX/deckHeight 的曲线）
    function ramp(zA, zB) {
      var SEG = 12;
      for (var i = 0; i < SEG; i++) {
        var z0 = zA + (zB - zA) * (i / SEG);
        var z1 = zA + (zB - zA) * ((i + 1) / SEG);
        var x0 = deckX(o, z0), x1 = deckX(o, z1);
        var y0 = deckHeight(o, z0), y1 = deckHeight(o, z1);
        var xm = (x0 + x1) / 2, ym = (y0 + y1) / 2, zm = (z0 + z1) / 2;
        var dz = z1 - z0, dy = y1 - y0;
        var L = Math.sqrt(dz * dz + dy * dy) + 0.5;
        var ang = Math.atan2(-dy, dz);
        var deck = new THREE.Mesh(new THREE.BoxGeometry(RAMP_W, 0.4, L), ovDeckMat);
        deck.position.set(xm, ym - 0.2, zm); deck.rotation.x = ang;
        deck.receiveShadow = true; g.add(deck);
        [-1, 1].forEach(function(s) {
          var rail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, L), ovRailMat);
          rail.position.set(xm + s * (RAMP_W / 2 - 0.15), ym + 0.5, zm);
          rail.rotation.x = ang; g.add(rail);
        });
      }
    }
    ramp(zStart, o.zClimbEnd);       // 上匝道：右侧 → 桥面中央
    ramp(o.zCruiseEnd, o.zEnd);      // 下匝道：桥面中央 → 右侧

    // 巡航桥面（水平）
    var cruiseLen = o.zClimbEnd - o.zCruiseEnd;
    var deckMid = (o.zClimbEnd + o.zCruiseEnd) / 2;
    var cruise = new THREE.Mesh(new THREE.BoxGeometry(DECK_W, 0.4, cruiseLen), ovDeckMat);
    cruise.position.set(0, DECK_H - 0.2, deckMid); cruise.receiveShadow = true; g.add(cruise);
    [-1, 1].forEach(function(s) {
      var rail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.1, cruiseLen), ovRailMat);
      rail.position.set(s * (DECK_W / 2 - 0.15), DECK_H + 0.55, deckMid); g.add(rail);
    });

    // 中央桥墩
    for (var pz = o.zCruiseEnd + 9; pz < o.zClimbEnd; pz += 18) {
      var pillar = new THREE.Mesh(new THREE.BoxGeometry(1.6, DECK_H, 1.6), ovConcreteMat);
      pillar.position.set(0, DECK_H / 2 - 0.3, pz); pillar.castShadow = true; g.add(pillar);
      var cap = new THREE.Mesh(new THREE.BoxGeometry(DECK_W * 0.8, 0.6, 2.2), ovConcreteMat);
      cap.position.set(0, DECK_H - 0.6, pz); g.add(cap);
    }

    // 入口指示牌（道路右侧）
    var signX = ROAD_W / 2 + SIDEWALK_W + 1.2;
    var post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 7, 8), ovConcreteMat);
    post.position.set(signX, 3.5, zStart + 4); g.add(post);
    var board = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.8, 3.4), new THREE.MeshLambertMaterial({ color: 0x1565C0 }));
    board.position.set(signX, 6.0, zStart + 4); g.add(board);
    var arrUp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.0, 0.55), ovArrowMat);
    arrUp.position.set(signX - 0.13, 6.1, zStart + 4); g.add(arrUp);
    var arrHead = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.55, 1.1), ovArrowMat);
    arrHead.position.set(signX - 0.13, 6.7, zStart + 4); g.add(arrHead);

    // 上匝道地面绿色箭头
    for (var az = zStart - 3; az > zStart - RAMP_LEN + 5; az -= 7) {
      var arr = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 2.6), ovArrowMat);
      var ay = deckHeight(o, az), ax = deckX(o, az);
      arr.position.set(ax, ay + 0.25, az);
      arr.rotation.x = Math.atan2(-(deckHeight(o, az - 2) - deckHeight(o, az + 2)), 4);
      g.add(arr);
    }

    o.group = g;
    return o;
  }

  // Bus stop & boarding state
  var lastBusStopZ = 0;
  var activeStops = [];
  var pullOver = { active: false, parked: false, startX: 0, startSpeed: 0, elapsed: 0, duration: 2.0, targetX: ROAD_W / 2 - 2.0 };
  var npcVehicles = [];
  var npcSpawnTimer = 1.0;
  var exitingPassengers = [];
  var lastTrafficLightZ = 0;
  var trafficLights = [];
  var policeViolations = 0;
  var police = { phase: 'idle', car: null, officers: [], driver: null, timer: 0, lightTimer: 0 };
  // Load bus routes saved by index.html
  var npcRoutes = (function() {
    try {
      var saved = JSON.parse(localStorage.getItem('dispatchBuses') || '[]');
      var routes = saved.filter(function(b) { return b.route && b.route.trim(); })
                        .map(function(b) { return b.route.trim(); });
      return routes.length > 0 ? routes : ['1路', '2路', '5路', '10路', '22路', '68路'];
    } catch(e) { return ['1路', '2路', '5路', '10路', '22路', '68路']; }
  })();

  // ── Road Tile Pool ──
  function makeTile() {
    var g = new THREE.Group();
    var surf = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W, 0.18, TILE_LEN), roadMat);
    surf.position.y = 0.09; surf.receiveShadow = true; g.add(surf);
    // sidewalks
    [-1, 1].forEach(function(s) {
      var sw = new THREE.Mesh(new THREE.BoxGeometry(SIDEWALK_W, 0.3, TILE_LEN), swMat);
      sw.position.set(s * (ROAD_W / 2 + SIDEWALK_W / 2), 0.15, 0); g.add(sw);
      var cu = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, TILE_LEN), curbMat);
      cu.position.set(s * (ROAD_W / 2 + 0.12), 0.2, 0); g.add(cu);
    });
    // center dashes
    for (var d = -TILE_LEN / 2 + 1; d < TILE_LEN / 2; d += 3) {
      var da = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 1.8), dashMat);
      da.position.set(0, 0.19, d); g.add(da);
    }
    // lane lines (two lanes each direction = 4 lanes total)
    [-ROAD_W / 4, ROAD_W / 4].forEach(function(lane) {
      for (var d2 = -TILE_LEN / 2 + 2; d2 < TILE_LEN / 2; d2 += 4) {
        var ll = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 1.2), dashMat);
        ll.position.set(lane, 0.19, d2); g.add(ll);
      }
    });
    // edge lines
    [-1, 1].forEach(function(s) {
      var ed = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.02, TILE_LEN), edgeMat);
      ed.position.set(s * (ROAD_W / 2 - 0.5), 0.19, 0); g.add(ed);
    });
    return g;
  }

  var tiles = [];
  var tileScenery = new Map();
  for (var i = 0; i < POOL; i++) {
    var t = makeTile();
    var wz = -(i - 10) * TILE_LEN;
    t.position.set(0, 0, wz);
    scene.add(t);
    tiles.push({ mesh: t, wz: wz });
  }

  // Scenery for a tile
  function spawnScenery(tile) {
    var objs = [];
    var z = tile.wz;
    // markers both sides (every tile)
    [-1, 1].forEach(function(s) {
      var mk = makeMarker();
      mk.position.set(s * (ROAD_W / 2 + SIDEWALK_W + 0.5), 0, z);
      scene.add(mk); objs.push(mk);
    });
    // trees - DENSE, close to road
    [-1, 1].forEach(function(s) {
      // near tree
      if (Math.random() > 0.15) {
        var tr = makeTree();
        tr.position.set(s * (ROAD_W / 2 + SIDEWALK_W + rand(1.5, 6)), 0, z + rand(-5, 5));
        scene.add(tr); objs.push(tr);
      }
      // far tree
      if (Math.random() > 0.3) {
        var tr2 = makeTree();
        tr2.position.set(s * (ROAD_W / 2 + SIDEWALK_W + rand(7, 20)), 0, z + rand(-5, 5));
        scene.add(tr2); objs.push(tr2);
      }
    });
    // street lights every ~3 tiles
    if (Math.round(z / TILE_LEN) % 3 === 0) {
      [-1, 1].forEach(function(s) {
        var p = makePole();
        p.position.set(s * (ROAD_W / 2 + SIDEWALK_W - 0.3), 0, z);
        p.rotation.y = s < 0 ? 0 : Math.PI;
        scene.add(p); objs.push(p);
      });
    }
    // buildings
    [-1, 1].forEach(function(s) {
      if (Math.random() > 0.4) {
        var b = makeBuilding();
        b.position.set(s * (ROAD_W / 2 + SIDEWALK_W + rand(12, 35)), 0, z + rand(-4, 4));
        scene.add(b); objs.push(b);
      }
    });
    // bus stops: at least 400 world units apart (~200m), right sidewalk only
    if (Math.abs(z - lastBusStopZ) >= 400 && Math.random() < 0.7) {
      var stopZ = z + rand(-2, 2);
      var stopX = ROAD_W / 2 + 1.1;
      var bs = makeBusStop();
      bs.position.set(stopX, 0, stopZ);
      scene.add(bs); objs.push(bs);
      lastBusStopZ = z;
      var numPax = 1 + Math.floor(Math.random() * 4);
      var paxList = [];
      for (var pi = 0; pi < numPax; pi++) {
        var pax = makePassenger();
        pax.position.set(stopX - 0.8 + rand(-0.5, 0.3), 0, stopZ + rand(-1.8, 1.8));
        pax.rotation.y = Math.PI / 2;
        scene.add(pax);
        paxList.push({ mesh: pax, state: 'waiting' });
      }
      activeStops.push({ tile: tile, worldX: stopX, worldZ: stopZ, passengers: paxList });
    }
    // Traffic lights: at least 500 world units apart
    if (Math.abs(z - lastTrafficLightZ) >= 500 && Math.random() < 0.75) {
      var lightZ = z + rand(-3, 3);
      // Zebra crossing (player encounters it just before the stopline)
      var zebra = makeZebraCrossing();
      zebra.position.set(0, 0, lightZ + 4);
      scene.add(zebra); objs.push(zebra);
      // Gantry
      var gantry = makeTrafficLightGantry();
      gantry.position.set(0, 0, lightZ);
      scene.add(gantry); objs.push(gantry);
      lastTrafficLightZ = z;
      var initState = Math.random() < 0.5 ? 'red' : 'green';
      var initTimer = initState === 'red' ? rand(8, 25) : rand(6, 20);
      var tl = {
        tile: tile, worldZ: lightZ, state: initState, timer: initTimer,
        mats: gantry.userData.mats,
        ctx: gantry.userData.ctx, tex: gantry.userData.tex,
        lastSec: -1, playerPassed: false
      };
      tl.mats.red.color.setHex(initState === 'red' ? 0xFF1744 : 0x3D0000);
      tl.mats.yellow.color.setHex(0x3D3200);
      tl.mats.green.color.setHex(initState === 'green' ? 0x00E676 : 0x003D16);
      trafficLights.push(tl);
    }
    tileScenery.set(tile, objs);
  }

  function clearScenery(tile) {
    var objs = tileScenery.get(tile);
    if (objs) { objs.forEach(function(o) { scene.remove(o); }); tileScenery.delete(tile); }
    activeStops = activeStops.filter(function(stop) {
      if (stop.tile === tile) {
        stop.passengers.forEach(function(p) { scene.remove(p.mesh); });
        return false;
      }
      return true;
    });
    trafficLights = trafficLights.filter(function(tl) {
      if (tl.tile === tile) { tl.tex.dispose(); return false; }
      return true;
    });
  }

  // Initial scenery
  tiles.forEach(function(t) { spawnScenery(t); });

  // Fork visuals
  var forkGroup = null, forkActive = false, forkZ = 0, nextForkDist = 200;

  // 立交桥状态机
  var overpass = { phase: 'none', cur: null, group: null };
  var nextOverpassDist = 240; // 第一座桥较早出现，让小朋友尽快看到

  function spawnFork(z) {
    var fg = new THREE.Group();
    var bAngle = 0.4;
    [-1, 1].forEach(function(dir) {
      for (var i = 1; i <= 6; i++) {
        var seg = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W * 0.7, 0.16, TILE_LEN * 0.8), roadMat);
        seg.position.set(dir * Math.sin(bAngle) * i * TILE_LEN * 0.7, 0.08,
          z - Math.cos(bAngle) * i * TILE_LEN * 0.7 - TILE_LEN);
        seg.rotation.y = -dir * bAngle;
        fg.add(seg);
      }
    });
    // road arrows
    [-1, 1].forEach(function(dir) {
      var arr = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.04, 3.5),
        new THREE.MeshBasicMaterial({ color: dir < 0 ? 0x4CAF50 : 0xFF9800 }));
      arr.position.set(dir * 2.8, 0.2, z + 5);
      arr.rotation.y = -dir * 0.2;
      fg.add(arr);
    });
    // sign post
    var sp = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 6, 6),
      new THREE.MeshLambertMaterial({ color: 0x555555 }));
    sp.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5, 3, z + 8);
    fg.add(sp);
    var board = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.2, 0.15),
      new THREE.MeshLambertMaterial({ color: 0x1565C0 }));
    board.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5, 5.5, z + 8);
    fg.add(board);
    // arrows on sign
    [-1, 1].forEach(function(dir) {
      var a = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 0.02),
        new THREE.MeshBasicMaterial({ color: dir < 0 ? 0x66BB6A : 0xFFA726 }));
      a.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5 + dir * 0.5, 5.5 + dir * 0.25, z + 7.9);
      a.rotation.z = dir * 0.4;
      fg.add(a);
    });
    scene.add(fg);
    return fg;
  }

  // Bus
  var bus = makeBus();
  scene.add(bus);

  // Clouds
  var cloudM = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
  for (var ci = 0; ci < 25; ci++) {
    var c = new THREE.Mesh(new THREE.SphereGeometry(rand(6, 18), 7, 5), cloudM);
    c.scale.set(rand(1, 3.5), 0.4, rand(0.8, 2));
    c.position.set(rand(-250, 250), rand(50, 90), rand(-200, 200));
    scene.add(c);
  }

  // ── Game State ──
  var G = { px: ROAD_W / 4, pz: 0, py: 0, heading: 0, speed: 0, dist: 0, keys: {},
    camPos: new THREE.Vector3(ROAD_W / 4, 9, 18) };

  // Touch state
  var touch = { steer: 0, gas: false, brake: false };

  // ── Keyboard Events ──
  var kd = function(e) {
    G.keys[e.key] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) !== -1) e.preventDefault();
  };
  var ku = function(e) { G.keys[e.key] = false; };
  window.addEventListener('keydown', kd);
  window.addEventListener('keyup', ku);

  // ── Resize ──
  var onR = function() {
    W = el.clientWidth; H = el.clientHeight;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  };
  window.addEventListener('resize', onR);

  // ── Touch Controls ──
  function setupTouchBtn(id, key, value, offValue) {
    var btn = document.getElementById(id);
    var setVal = function() { touch[key] = value; };
    var clearVal = function() { touch[key] = offValue; };
    btn.addEventListener('pointerdown', function(e) { e.preventDefault(); setVal(); });
    btn.addEventListener('pointerup', clearVal);
    btn.addEventListener('pointerleave', clearVal);
    btn.addEventListener('pointercancel', clearVal);
  }
  setupTouchBtn('btnGas', 'gas', true, false);
  setupTouchBtn('btnBrake', 'brake', true, false);
  setupTouchBtn('btnLeft', 'steer', 1, 0);
  setupTouchBtn('btnRight', 'steer', -1, 0);

  // ── HUD elements ──
  var hudSpeedEl = document.getElementById('hudSpeedVal');
  var hudDistEl = document.getElementById('hudDistVal');
  var hudForkEl = document.getElementById('hudFork');
  var hudRampEl = document.getElementById('hudRamp');
  var hudSpeedBox = document.getElementById('hudSpeed');
  var hudDistBox = document.getElementById('hudDist');
  var touchControlsEl = document.getElementById('touchControls');
  var startOverlay = document.getElementById('startOverlay');

  document.getElementById('startDriveBtn').addEventListener('click', function() {
    startOverlay.style.display = 'none';
    hudSpeedBox.style.display = 'block';
    hudDistBox.style.display = 'block';
    touchControlsEl.style.display = 'flex';
  });

  // ── Game Loop ──
  var clock = new THREE.Clock();

  function loop() {
    requestAnimationFrame(loop);
    var dt = Math.min(clock.getDelta(), 0.05);

    // Speed & Pull-over
    var gasOn = G.keys['ArrowUp'] || G.keys['w'] || touch.gas;
    var brakeOn = G.keys['ArrowDown'] || G.keys['s'] || touch.brake;
    var controlsLocked = police.phase === 'decel' || police.phase === 'block' || police.phase === 'arrest' || police.phase === 'leave';

    // ── 立交桥：生成 / 上桥 / 下桥 状态机 ──
    nextOverpassDist -= Math.abs(G.speed) * dt * 30;
    if (nextOverpassDist <= 0 && overpass.phase === 'none' && police.phase === 'idle') {
      var ov = buildOverpass(G.pz - 70);
      overpass.cur = ov; overpass.group = ov.group; overpass.phase = 'approaching';
      scene.add(ov.group);
    }
    var rightPressed = G.keys['ArrowRight'] || G.keys['d'] || touch.steer === -1;
    if (overpass.phase === 'approaching') {
      var diff = G.pz - overpass.cur.zStart; // >0：公交车还在匝道入口之前
      if (diff < 35 && diff > -8 && rightPressed) {
        overpass.phase = 'riding';
      } else if (G.pz < overpass.cur.zStart - 10) {
        overpass.phase = 'missed'; // 没按右键，错过上桥，继续走地面主路
      }
    }
    if (overpass.phase === 'riding' && G.pz < overpass.cur.zEnd) {
      overpass.phase = 'done';
    }
    if ((overpass.phase === 'missed' || overpass.phase === 'done') &&
        overpass.cur && G.pz < overpass.cur.zEnd - 45) {
      scene.remove(overpass.group);
      overpass.group = null; overpass.cur = null; overpass.phase = 'none';
      nextOverpassDist = rand(300, 600);
    }
    var onOverpass = overpass.phase === 'riding';

    // Traffic lights: update timers, visuals, countdown canvas, auto-brake target
    var autoSpeedTarget = 1.0;
    trafficLights.forEach(function(tl) {
      tl.timer -= dt;
      if (tl.timer <= 0) {
        if (tl.state === 'red') { tl.state = 'green'; tl.timer = rand(12, 20); }
        else if (tl.state === 'green') { tl.state = 'yellow'; tl.timer = 3.0; }
        else { tl.state = 'red'; tl.timer = rand(15, 25); }
        tl.lastSec = -1;
        tl.mats.red.color.setHex(tl.state === 'red' ? 0xFF1744 : 0x3D0000);
        tl.mats.yellow.color.setHex(tl.state === 'yellow' ? 0xFFD600 : 0x3D3200);
        tl.mats.green.color.setHex(tl.state === 'green' ? 0x00E676 : 0x003D16);
      }
      var sec = Math.ceil(tl.timer);
      if (sec !== tl.lastSec) {
        tl.lastSec = sec;
        var tlCtx = tl.ctx;
        tlCtx.clearRect(0, 0, 64, 64);
        tlCtx.fillStyle = tl.state === 'red' ? '#ff1744' : (tl.state === 'yellow' ? '#ffd600' : '#00e676');
        tlCtx.font = 'bold 40px Arial';
        tlCtx.textAlign = 'center';
        tlCtx.textBaseline = 'middle';
        tlCtx.fillText(sec > 0 ? String(sec) : '', 32, 32);
        tl.tex.needsUpdate = true;
      }
      // Auto-brake: slow bus smoothly when red or yellow light is ahead
      if (!gasOn && !pullOver.active && !pullOver.parked && !onOverpass) {
        if (tl.state === 'red' || tl.state === 'yellow') {
          var dist = G.pz - tl.worldZ; // positive = light is ahead of bus
          if (dist > 2 && dist < 80) {
            autoSpeedTarget = Math.min(autoSpeedTarget, Math.max(0, (dist - 3) / 72));
          }
        }
      }
    });

    if (controlsLocked) {
      if (police.phase === 'decel') {
        // smoothly decelerate to 0 — actual lerp is driven by police state machine below
      } else {
        G.speed = 0;
      }
    } else if (onOverpass) {
      // 上桥后自动巡航，油门可加速，刹车减速但不停车（保证安全开下桥）
      if (gasOn) G.speed = Math.min(G.speed + 3.5 * dt, 2.6);
      else if (brakeOn) G.speed = Math.max(G.speed - 2.5 * dt, 0.5);
      else G.speed += (1.5 - G.speed) * dt * 1.5;
    } else if (gasOn) {
      G.speed = Math.min(G.speed + 3.5 * dt, 2.24);
      pullOver.active = false;
      pullOver.parked = false;
    } else if (brakeOn && !pullOver.active && !pullOver.parked && G.speed > 0.05) {
      pullOver.active = true;
      pullOver.startX = G.px;
      pullOver.startSpeed = G.speed;
      pullOver.elapsed = 0;
    } else if (pullOver.parked) {
      // Parked: brake = reverse, release = coast to stop
      if (brakeOn) {
        G.speed = Math.max(G.speed - 2.8 * dt, -1.05);
      } else if (G.speed < 0) {
        G.speed = Math.min(G.speed + 3.5 * dt, 0);
      }
    } else if (!pullOver.active) {
      G.speed += (autoSpeedTarget - G.speed) * dt * 1.0;
    }

    // Steer (disabled while pulling over or controls locked)
    var st = 0;
    if (!controlsLocked && !pullOver.active && !onOverpass) {
      if (G.keys['ArrowLeft'] || G.keys['a']) st = 1;
      if (G.keys['ArrowRight'] || G.keys['d']) st = -1;
      if (touch.steer) st = touch.steer;
      G.heading += st * 2.2 * dt * Math.min(Math.abs(G.speed), 1.5);
    }
    // Auto-center in right lane when not manually steering
    if (!controlsLocked && !pullOver.active && !pullOver.parked && !onOverpass && st === 0 && G.speed > 0.1) {
      G.px += (ROAD_W / 4 - G.px) * dt * 0.6;
    }

    // Move
    if (!controlsLocked && pullOver.active) {
      pullOver.elapsed = Math.min(pullOver.elapsed + dt, pullOver.duration);
      var t = pullOver.elapsed / pullOver.duration;
      var ease = t * t * (3 - 2 * t);
      G.speed = pullOver.startSpeed * (1 - ease);
      G.px = pullOver.startX + (pullOver.targetX - pullOver.startX) * ease;
      G.pz -= Math.cos(G.heading) * G.speed;
      G.dist += Math.abs(G.speed) * dt * 30;
      if (pullOver.elapsed >= pullOver.duration) {
        G.speed = 0; pullOver.active = false; pullOver.parked = true;
        // Spawn 0-4 disembarking passengers from the right door
        var numExit = Math.floor(Math.random() * 5);
        for (var ei = 0; ei < numExit; ei++) {
          var ep = makePassenger();
          ep.position.set(G.px + 1.8, 0, G.pz + rand(-3.5, 3.5));
          ep.rotation.y = -Math.PI / 2; // face sidewalk (+X)
          scene.add(ep);
          exitingPassengers.push({ mesh: ep, targetX: ROAD_W / 2 + 1.2 });
        }
      }
    } else if (!controlsLocked) {
      G.px -= Math.sin(G.heading) * G.speed;
      G.pz -= Math.cos(G.heading) * G.speed;
      G.dist += Math.abs(G.speed) * dt * 30;
    }

    // ── 立交桥：沿桥面路径调整横向与高度 ──
    if (onOverpass) {
      var o = overpass.cur;
      G.px += (deckX(o, G.pz) - G.px) * Math.min(1, dt * 4);
      G.py = deckHeight(o, G.pz);
      G.heading += (0 - G.heading) * Math.min(1, dt * 3); // 在桥上保持车身笔直
    } else {
      G.py += (0 - G.py) * Math.min(1, dt * 4);
    }

    // ── Police violation detection ──
    trafficLights.forEach(function(tl) {
      if (!tl.playerPassed && G.pz < tl.worldZ) {
        tl.playerPassed = true;
        if (tl.state === 'red' && G.speed > 0.15 && police.phase === 'idle') {
          policeViolations++;
          if (policeViolations >= 3) {
            var pcMesh = makePoliceCar();
            var spawnZ = G.pz - 220;
            pcMesh.position.set(ROAD_W / 4, 0, spawnZ);
            pcMesh.rotation.y = Math.PI;
            scene.add(pcMesh);
            police.phase = 'chase';
            police.car = { mesh: pcMesh, wz: spawnZ, speed: 1.8, startWz: 0, targetWz: 0, busStartSpeed: 0 };
          }
        }
      }
    });

    // ── Police state machine ──
    if (police.phase !== 'idle') {
      police.lightTimer += dt;
      if (police.car) {
        var flash = Math.floor(police.lightTimer * 6) % 2 === 0;
        police.car.mesh.userData.rMat.color.setHex(flash ? 0xFF1111 : 0x220000);
        police.car.mesh.userData.bMat.color.setHex(flash ? 0x220000 : 0x1111FF);
      }

      if (police.phase === 'chase') {
        police.car.wz += police.car.speed;
        police.car.mesh.position.z = police.car.wz;
        if (police.car.wz > G.pz - 30) {
          police.phase = 'decel';
          police.timer = 1.4;
          police.car.startWz = police.car.wz;
          police.car.targetWz = G.pz - 8;
          police.car.busStartSpeed = G.speed;
        }
      }

      if (police.phase === 'decel') {
        police.timer = Math.max(0, police.timer - dt);
        var decelT = 1 - police.timer / 1.4;
        var decelE = decelT * decelT * (3 - 2 * decelT);
        police.car.wz = police.car.startWz + (police.car.targetWz - police.car.startWz) * decelE;
        police.car.mesh.position.z = police.car.wz;
        G.speed = police.car.busStartSpeed * (1 - decelE);
        if (police.timer <= 0) {
          G.speed = 0;
          police.car.wz = police.car.targetWz;
          police.car.mesh.position.z = police.car.targetWz;
          police.phase = 'block';
          police.timer = 0.9;
        }
      }

      if (police.phase === 'block') {
        police.timer -= dt;
        if (police.timer <= 0) {
          police.phase = 'arrest';
          var pcX = ROAD_W / 4;
          var pcZ = police.car.wz;
          [-1.2, 1.2].forEach(function(xOff) {
            var poff = makePoliceOfficer();
            poff.position.set(pcX + xOff, 0, pcZ + 1.5);
            scene.add(poff);
            police.officers.push({ mesh: poff, tx: G.px, tz: G.pz - 4, done: false });
          });
          var drv = makeBusDriver();
          drv.position.set(G.px + 2.0, 0, G.pz - 1.5);
          drv.rotation.y = Math.PI;
          scene.add(drv);
          police.driver = { mesh: drv, tx: pcX, tz: pcZ + 1.5, done: false };
        }
      }

      if (police.phase === 'arrest') {
        var allArrested = true;
        police.officers.forEach(function(o) {
          if (!o.done) {
            allArrested = false;
            var odx = o.tx - o.mesh.position.x;
            var odz = o.tz - o.mesh.position.z;
            var od = Math.sqrt(odx * odx + odz * odz);
            if (od < 0.5) { o.done = true; }
            else {
              o.mesh.position.x += (odx / od) * 1.2 * dt;
              o.mesh.position.z += (odz / od) * 1.2 * dt;
              o.mesh.rotation.y = Math.atan2(odx, odz);
            }
          }
        });
        if (police.driver && !police.driver.done) {
          allArrested = false;
          var ddx = police.driver.tx - police.driver.mesh.position.x;
          var ddz = police.driver.tz - police.driver.mesh.position.z;
          var ddd = Math.sqrt(ddx * ddx + ddz * ddz);
          if (ddd < 0.5) { police.driver.done = true; }
          else {
            police.driver.mesh.position.x += (ddx / ddd) * 1.2 * dt;
            police.driver.mesh.position.z += (ddz / ddd) * 1.2 * dt;
            police.driver.mesh.rotation.y = Math.atan2(ddx, ddz);
          }
        }
        if (allArrested && (!police.driver || police.driver.done)) {
          police.officers.forEach(function(o) { scene.remove(o.mesh); });
          police.officers = [];
          if (police.driver) { scene.remove(police.driver.mesh); police.driver = null; }
          police.car.mesh.rotation.y = 0; // face forward (-Z) to drive away
          police.phase = 'leave';
          police.car.speed = 0;
        }
      }

      if (police.phase === 'leave') {
        police.car.speed = Math.min(police.car.speed + 3 * dt, 2.5);
        police.car.wz -= police.car.speed;
        police.car.mesh.position.z = police.car.wz;
        if (police.car.wz < G.pz - 280) {
          scene.remove(police.car.mesh);
          police.car = null;
          police.phase = 'idle';
          policeViolations = 0;
          pullOver.active = false;
          pullOver.parked = false;
        }
      }
    }

    // Boarding: detect when bus is nearly stopped near a stop with waiting passengers
    if (Math.abs(G.speed) < 0.15) {
      activeStops.forEach(function(stop) {
        var dx = G.px - stop.worldX;
        var dz = G.pz - stop.worldZ;
        if (Math.sqrt(dx * dx + dz * dz) < 9) {
          stop.passengers.forEach(function(p) {
            if (p.state === 'waiting') p.state = 'boarding';
          });
        }
      });
    }

    // Animate disembarking passengers walking to sidewalk
    exitingPassengers = exitingPassengers.filter(function(ep) {
      var dx = ep.targetX - ep.mesh.position.x;
      if (dx <= 0.25) { scene.remove(ep.mesh); return false; }
      ep.mesh.position.x += Math.min(dx, 1.5 * dt);
      return true;
    });

    // Animate boarding passengers walking to bus
    activeStops.forEach(function(stop) {
      stop.passengers.forEach(function(p) {
        if (p.state === 'boarding') {
          var dx = G.px - p.mesh.position.x;
          var dz = G.pz - p.mesh.position.z;
          var d = Math.sqrt(dx * dx + dz * dz);
          if (d < 0.7) {
            p.state = 'boarded';
            scene.remove(p.mesh);
          } else {
            var mv = 2.5 * dt;
            p.mesh.position.x += (dx / d) * mv;
            p.mesh.position.z += (dz / d) * mv;
            p.mesh.rotation.y = Math.atan2(dx, dz);
          }
        }
      });
    });

    // Bus
    bus.position.set(G.px, G.py, G.pz);
    bus.rotation.y = G.heading;
    // 上下匝道时车身俯仰
    if (onOverpass) {
      var oc = overpass.cur;
      bus.rotation.x = Math.atan2(deckHeight(oc, G.pz - 1) - deckHeight(oc, G.pz + 1), 2);
    } else {
      bus.rotation.x += (0 - bus.rotation.x) * Math.min(1, dt * 4);
    }
    bus.userData.wheels.forEach(function(w) { w.rotation.x += G.speed * 0.4; });

    // ── Recycle tiles ──
    tiles.forEach(function(t) {
      var rel = t.wz - G.pz;
      if (rel > (POOL / 2) * TILE_LEN) {
        clearScenery(t);
        t.wz -= POOL * TILE_LEN;
        t.mesh.position.z = t.wz;
        t.mesh.position.x = 0;
        spawnScenery(t);
      } else if (rel < -(POOL / 2) * TILE_LEN) {
        clearScenery(t);
        t.wz += POOL * TILE_LEN;
        t.mesh.position.z = t.wz;
        t.mesh.position.x = 0;
        spawnScenery(t);
      }
    });

    // ── NPC oncoming vehicles ──
    npcSpawnTimer -= dt;
    if (npcSpawnTimer <= 0) {
      var npcTypes = ['car','car','car','car','bus','bus','dump','truck','coach'];
      var npcType = npcTypes[Math.floor(Math.random() * npcTypes.length)];
      var npcRoute = (npcType === 'bus') ? pick(npcRoutes) : null;
      var npcMesh = makeNPCVehicle(npcType, npcRoute);
      var npcLaneX = Math.random() < 0.5 ? -(ROAD_W * 3 / 8) : -(ROAD_W / 8);
      var spawnZ = G.pz - rand(160, 380);
      npcMesh.position.set(npcLaneX, 0, spawnZ);
      npcMesh.rotation.y = Math.PI;
      scene.add(npcMesh);
      npcVehicles.push({ mesh: npcMesh, speed: rand(0.65, 1.5), wz: spawnZ });
      npcSpawnTimer = rand(1.5, 3.5);
    }
    npcVehicles = npcVehicles.filter(function(npc) {
      npc.wz += npc.speed;
      npc.mesh.position.z = npc.wz;
      if (npc.wz > G.pz + 130) { scene.remove(npc.mesh); return false; }
      return true;
    });

    // ── Fork ──
    nextForkDist -= Math.abs(G.speed) * dt * 30;
    var nearFork = false;
    if (nextForkDist <= 0 && !forkActive && overpass.phase === 'none') {
      forkZ = G.pz - 80;
      forkGroup = spawnFork(forkZ);
      forkActive = true;
      nextForkDist = rand(250, 500);
    }
    if (forkActive && forkGroup) {
      var fd = G.pz - forkZ;
      nearFork = fd > -40 && fd < 15;
      if (fd < -30) {
        scene.remove(forkGroup); forkGroup = null; forkActive = false;
      }
    }

    // Camera
    var cd = 16, ch = 8;
    if (G.py > 0.3) { cd = 18; ch = 11; } // 上桥后镜头抬高拉远，俯瞰两边楼房风景
    var ideal = new THREE.Vector3(
      G.px + Math.sin(G.heading) * cd, ch + G.py,
      G.pz + Math.cos(G.heading) * cd
    );
    G.camPos.lerp(ideal, 0.065);
    camera.position.copy(G.camPos);
    camera.lookAt(G.px - Math.sin(G.heading) * 14, 2 + G.py, G.pz - Math.cos(G.heading) * 14);

    // Follow ground + sun
    ground.position.x = G.px; ground.position.z = G.pz;
    sun.position.set(G.px + 60, 120, G.pz - 40);
    sun.target.position.set(G.px, 0, G.pz);
    sun.target.updateMatrixWorld();

    // Update HUD
    hudSpeedEl.textContent = Math.abs(Math.round(G.speed * 32));
    hudDistEl.textContent = Math.round(G.dist);
    hudForkEl.style.display = nearFork ? 'block' : 'none';
    // 接近立交桥入口时提示按右键上桥
    var showRampHint = false;
    if (overpass.phase === 'approaching') {
      var rd = G.pz - overpass.cur.zStart;
      showRampHint = rd > -8 && rd < 55;
    }
    hudRampEl.style.display = showRampHint ? 'block' : 'none';

    renderer.render(scene, camera);
  }
  loop();
}

// Start the game when page loads
initGame();
</script>
