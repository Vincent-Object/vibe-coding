<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公交车管理 - 小朋友乐园</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
  padding: 20px;
}
h1 {
  color: #ffd166;
  text-align: center;
  font-size: 28px;
  margin-bottom: 8px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
.subtitle {
  color: rgba(255,255,255,0.6);
  text-align: center;
  font-size: 14px;
  margin-bottom: 20px;
}
.toolbar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 24px;
  border: 2px solid #ffd166;
  border-radius: 25px;
  background: transparent;
  color: #fff;
  font-family: inherit;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s;
  font-weight: bold;
}
.btn:hover {
  background: #ffd166;
  color: #1a1a2e;
  transform: translateY(-2px);
  box-shadow: 0 4px 15px rgba(255,209,102,0.4);
}
.btn-add { border-color: #06d6a0; }
.btn-add:hover { background: #06d6a0; }
.btn-del { border-color: #ef476f; }
.btn-del:hover { background: #ef476f; }
.btn-go { border-color: #ffd166; }
.btn-go:hover { background: #ffd166; }
.btn-drive { border-color: #42A5F5; }
.btn-drive:hover { background: #42A5F5; }

.bus-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  max-width: 1100px;
  margin: 0 auto;
}
.bus-card {
  width: 240px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 16px;
  position: relative;
  transition: transform 0.3s, box-shadow 0.3s;
  animation: cardIn 0.5s ease-out;
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(0.8) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.bus-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}

.bus-svg-container {
  width: 100%;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

.route-input-area {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.route-input-area label {
  color: rgba(255,255,255,0.7);
  font-size: 13px;
}
.route-input {
  width: 80px;
  padding: 6px 10px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 10px;
  background: rgba(0,0,0,0.3);
  color: #ffd166;
  font-family: inherit;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: border-color 0.3s;
}
.route-input:focus {
  border-color: #ffd166;
}
.route-display {
  flex: 1;
  min-height: 32px;
  padding: 4px 10px;
  background: rgba(239,71,111,0.15);
  border: 2px dashed #ef476f;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ef476f;
  font-weight: bold;
  font-size: 18px;
  letter-spacing: 2px;
}
.route-display.has-route {
  color: #ff3333;
  font-size: 22px;
  font-weight: 900;
  text-shadow: 0 0 10px rgba(255,51,51,0.5);
}

.delete-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border: 2px solid #ef476f;
  border-radius: 50%;
  background: transparent;
  color: #ef476f;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  line-height: 1;
}
.delete-btn:hover {
  background: #ef476f;
  color: #fff;
  transform: rotate(90deg);
}

.empty-hint {
  text-align: center;
  color: rgba(255,255,255,0.3);
  font-size: 18px;
  padding: 60px 20px;
}

/* ═══ 驾驶视图样式 ═══ */
#driveView {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #111;
  font-family: 'SF Pro Display','Segoe UI',system-ui,sans-serif;
}
#driveView .drive-canvas-container {
  width: 100%;
  height: 100%;
}

#driveView .drive-back-btn {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 8px 22px;
  border-radius: 20px;
  border: 2px solid rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: all 0.2s;
}
#driveView .drive-back-btn:hover {
  background: rgba(255,255,255,0.2);
}
#driveView .hud-speed {
  position: absolute;
  top: 14px;
  left: 14px;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
  padding: 10px 20px;
  color: #fff;
  backdrop-filter: blur(8px);
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.12);
}
#driveView .hud-speed .label { font-size: 11px; opacity: 0.6; letter-spacing: 2px; }
#driveView .hud-speed .value { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
#driveView .hud-speed .unit { font-size: 13px; font-weight: 400; margin-left: 4px; }
#driveView .hud-dist {
  position: absolute;
  top: 14px;
  right: 14px;
  background: rgba(0,0,0,0.6);
  border-radius: 16px;
  padding: 10px 20px;
  color: #fff;
  backdrop-filter: blur(8px);
  z-index: 10;
  border: 1px solid rgba(255,255,255,0.12);
}
#driveView .hud-dist .label { font-size: 11px; opacity: 0.6; letter-spacing: 2px; }
#driveView .hud-dist .value { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
#driveView .hud-dist .unit { font-size: 13px; font-weight: 400; margin-left: 4px; }

#driveView .hud-fork {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg,rgba(255,152,0,0.9),rgba(255,87,34,0.9));
  color: #fff;
  padding: 12px 32px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 800;
  z-index: 10;
  box-shadow: 0 4px 24px rgba(255,152,0,0.5);
  animation: fp .6s ease-in-out infinite alternate;
  display: none;
}
#driveView .touch-controls {
  position: absolute;
  bottom: 18px;
  left: 18px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
#driveView .touch-btn {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.4);
  color: #fff;
  font-size: 22px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  cursor: pointer;
  backdrop-filter: blur(4px);
}
#driveView .touch-btn-gas { background: rgba(76,175,80,0.35); }
#driveView .touch-btn-brake { background: rgba(244,67,54,0.35); }
#driveView .touch-row { display: flex; gap: 6px; }

/* Start overlay */
#driveView .start-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,rgba(0,0,0,0.2),rgba(0,0,0,0.75));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 30;
  color: #fff;
  gap: 16px;
}

#driveView .start-overlay .title {
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 3px;
  text-shadow: 0 4px 30px rgba(33,150,243,0.7);
  color: #64B5F6;
}
#driveView .start-overlay .instructions {
  font-size: 15px;
  opacity: 0.85;
  text-align: center;
  line-height: 2.0;
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px 28px;
}
#driveView .start-overlay .start-btn {
  margin-top: 6px;
  padding: 14px 56px;
  font-size: 22px;
  font-weight: 800;
  background: linear-gradient(135deg,#1565C0,#42A5F5);
  color: #fff;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  box-shadow: 0 6px 30px rgba(33,150,243,0.5);
  letter-spacing: 2px;
}
@keyframes fp {
  from { opacity: .85; transform: translateX(-50%) scale(.97); }
  to { opacity: 1; transform: translateX(-50%) scale(1.04); }
}
</style>
</head>
<body>

<!-- ═══ 视图1: 公交车管理 ═══ -->
<div id="mainView">
<h1>🚌 公交车管理站 🚌</h1>
<p class="subtitle">添加公交车，输入路线号，管理你的车队！</p>

<div class="toolbar">
  <button class="btn btn-add" id="addBtn">➕ 添加公交车</button>
  <button class="btn btn-del" id="delBtn">🗑️ 删除最后一个</button>
  <button class="btn btn-go" id="goBtn">🚦 发车！</button>
  <button class="btn btn-drive" id="driveBtn">🎮 公交车驾驶</button>
</div>

<div class="bus-grid" id="busGrid"></div>
</div>

<!-- ═══ 视图3: 公交车驾驶 ═══ -->
<div id="driveView">
  <div class="drive-canvas-container" id="driveCanvas"></div>
  <button class="drive-back-btn" id="driveBackBtn">⬅ 返回管理站</button>
  <div class="hud-speed" id="hudSpeed" style="display:none;">
    <div class="label">速度</div>
    <div><span class="value" id="hudSpeedVal">0</span><span class="unit">km/h</span></div>
  </div>
  <div class="hud-dist" id="hudDist" style="display:none;">
    <div class="label">里程</div>
    <div><span class="value" id="hudDistVal">0</span><span class="unit">m</span></div>
  </div>
  <div class="hud-fork" id="hudFork">⚠️ 前方分叉路口！</div>
  <div class="touch-controls" id="touchControls" style="display:none;">
    <div class="touch-btn touch-btn-gas" id="btnGas">▲</div>
    <div class="touch-row">
      <div class="touch-btn" id="btnLeft">◀</div>
      <div class="touch-btn touch-btn-brake" id="btnBrake">▼</div>
      <div class="touch-btn" id="btnRight">▶</div>
    </div>
  </div>
  <div class="start-overlay" id="startOverlay">
    <div class="title">🚌 公交车驾驶员</div>
    <div class="instructions">
      <b style="color:#81D4FA">⬆ W</b> 加速 &nbsp;&nbsp; <b style="color:#EF9A9A">⬇ S</b> 刹车<br>
      <b style="color:#A5D6A7">⬅ A</b> 左转 &nbsp;&nbsp; <b style="color:#FFE082">➡ D</b> 右转<br>
      遇到路口选择方向！触屏可用左下角按钮
    </div>
    <button class="start-btn" id="startDriveBtn">出发 🚌</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════
   视图1: 公交车管理逻辑 (原有功能)
   ═══════════════════════════════════════════════ */
let buses = [];
let nextId = 1;

const COLORS = [
  '#e63946', '#457b9d', '#2a9d8f', '#e9c46a',
  '#f4a261', '#264653', '#9b59b6', '#3498db',
  '#e74c3c', '#1abc9c', '#f39c12', '#8e44ad',
  '#2980b9', '#27ae60', '#d35400', '#c0392b'
];

function randomColor() {
  return COLORS[Math.floor(Math.random() * COLORS.length)];
}

function generateBusSVG(color, routeNum, busId) {
  const r = escapeHtml(routeNum || '');
  return `
<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
  <defs>
    <linearGradient id="bodyGrad${busId}" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:${color};stop-opacity:1"/>
      <stop offset="100%" style="stop-color:${adjustColor(color,-30)};stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="15" y="35" width="170" height="70" rx="12" ry="12"
        fill="url(#bodyGrad${busId})" stroke="${adjustColor(color,-40)}" stroke-width="2.5"/>
  <rect x="25" y="42" width="150" height="38" rx="6" ry="6"
        fill="#87CEEB" stroke="#5ba3c6" stroke-width="1.5" opacity="0.85"/>
  <line x1="100" y1="42" x2="100" y2="80" stroke="#5ba3c6" stroke-width="1.5"/>
  ${r ? `
  <text x="62" y="68" text-anchor="middle"
        font-family="'Comic Sans MS', cursive, sans-serif, 'Microsoft YaHei'"
        font-size="24" font-weight="900" fill="#ff0000"
        style="text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;">
    ${r}
  </text>
  <text x="138" y="68" text-anchor="middle"
        font-family="'Comic Sans MS', cursive, sans-serif, 'Microsoft YaHei'"
        font-size="24" font-weight="900" fill="#ff0000"
        style="text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff;">
    ${r}
  </text>` : ''}
  <circle cx="55" cy="108" r="13" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="55" cy="108" r="7" fill="#888"/>
  <circle cx="55" cy="108" r="3" fill="#bbb"/>
  <circle cx="145" cy="108" r="13" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="145" cy="108" r="7" fill="#888"/>
  <circle cx="145" cy="108" r="3" fill="#bbb"/>
  <rect x="75" y="18" width="50" height="24" rx="6" ry="6"
        fill="#222" stroke="#111" stroke-width="2"/>
  <rect x="165" y="52" width="12" height="20" rx="2" ry="2"
        fill="#ffeb3b" stroke="#fbc02d" stroke-width="1.5" opacity="0.9"/>
  <rect x="168" y="56" width="6" height="4" rx="1" fill="#ff9800"/>
  <rect x="168" y="63" width="6" height="4" rx="1" fill="#ff9800"/>
  <ellipse cx="175" cy="72" rx="5" ry="3" fill="#ffeb3b" opacity="0.7"/>
  <path d="M 30 105 Q 30 118 43 118 L 67 118 Q 80 118 80 105"
        fill="none" stroke="${adjustColor(color,-40)}" stroke-width="2"/>
  <path d="M 120 105 Q 120 118 133 118 L 157 118 Q 170 118 170 105"
        fill="none" stroke="${adjustColor(color,-40)}" stroke-width="2"/>
  <rect x="30" y="88" width="20" height="8" rx="2" fill="#ccc" stroke="#999" stroke-width="1"/>
  <rect x="150" y="88" width="20" height="8" rx="2" fill="#ccc" stroke="#999" stroke-width="1"/>
</svg>`;
}

function adjustColor(hex, amount) {
  let r = parseInt(hex.slice(1, 3), 16);
  let g = parseInt(hex.slice(3, 5), 16);
  let b = parseInt(hex.slice(5, 7), 16);
  r = Math.max(0, Math.min(255, r + amount));
  g = Math.max(0, Math.min(255, g + amount));
  b = Math.max(0, Math.min(255, b + amount));
  return '#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderBuses() {
  const grid = document.getElementById('busGrid');
  if (buses.length === 0) {
    grid.innerHTML = '<div class="empty-hint">🚌 还没有公交车，点击上方按钮添加吧！</div>';
    return;
  }
  grid.innerHTML = buses.map(bus => `
    <div class="bus-card" data-id="${bus.id}">
      <button class="delete-btn" onclick="removeBus(${bus.id})" title="删除这辆公交">×</button>
      <div class="bus-svg-container">
        ${generateBusSVG(bus.color, bus.route, bus.id)}
      </div>
      <div class="route-input-area">
        <label>路线号:</label>
        <input type="text" class="route-input" placeholder="输入..."
               value="${escapeHtml(bus.route)}"
               maxlength="6"
               onchange="updateRoute(${bus.id}, this.value)"
               oninput="updateRoutePreview(${bus.id}, this.value)">
      </div>
      <div class="route-display ${bus.route ? 'has-route' : ''}" id="display-${bus.id}">
        ${bus.route ? `🚏 路线 ${escapeHtml(bus.route)}` : '未设置路线'}
      </div>
    </div>
  `).join('');
}

function addBus() {
  if (buses.length >= 8) {
    alert('最多只能有 8 辆公交车哦！（两行每行4个）');
    return;
  }
  buses.push({ id: nextId++, color: randomColor(), route: '' });
  renderBuses();
}

function removeBus(id) {
  buses = buses.filter(b => b.id !== id);
  renderBuses();
}

function removeLastBus() {
  if (buses.length === 0) { alert('没有公交车可以删除啦！'); return; }
  buses.pop();
  renderBuses();
}

function updateRoute(id, value) {
  const bus = buses.find(b => b.id === id);
  if (bus) { bus.route = value.trim(); renderBuses(); }
}

function updateRoutePreview(id, value) {
  const display = document.getElementById(`display-${id}`);
  if (!display) return;
  if (value.trim()) {
    display.textContent = `🚏 路线 ${value}`;
    display.className = 'route-display has-route';
  } else {
    display.textContent = '未设置路线';
    display.className = 'route-display';
  }
}

document.getElementById('addBtn').addEventListener('click', addBus);
document.getElementById('delBtn').addEventListener('click', removeLastBus);
document.getElementById('goBtn').addEventListener('click', () => {
  const validBuses = buses.filter(b => b.route.trim());
  if (validBuses.length === 0) {
    alert('请先给至少一辆公交车输入路线号再发车哦！');
    return;
  }
  localStorage.setItem('dispatchBuses', JSON.stringify(validBuses));
  window.open('city.html', '_blank');
});
document.getElementById('driveBtn').addEventListener('click', function() {
  var busData = {};
  if (buses.length > 0) busData = { route: buses[0].route, color: buses[0].color };
  enterDriveView(busData);
});

addBus();

// Auto-enter drive view when redirected from city.html
if (window.location.hash === '#drive') {
  var _driveData = localStorage.getItem('driveBusData');
  if (_driveData) {
    try { enterDriveView(JSON.parse(_driveData)); } catch(e) { enterDriveView(); }
  } else {
    enterDriveView();
  }
}

/* ═══════════════════════════════════════════════
   视图切换
   ═══════════════════════════════════════════════ */
function enterDriveView(busData) {
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('driveView').style.display = 'block';
  document.body.style.padding = '0';
  document.body.style.background = '#111';
  initDriveGame(busData || {});
}

function exitDriveView() {
  destroyDriveGame();
  document.getElementById('driveView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.body.style.padding = '20px';
  document.body.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
}

document.getElementById('driveBackBtn').addEventListener('click', exitDriveView);

/* ═══════════════════════════════════════════════
   视图3: 公交车驾驶游戏 (从 bus-game.jsx 转换)
   ═══════════════════════════════════════════════ */
var driveState = null; // holds all game state for cleanup

const ROAD_W = 13;
const SIDEWALK_W = 3;
const TILE_LEN = 12;
const POOL = 60;

function rand(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ═══ ROUTE NUMBER TEXTURE ═══ */
function makeRouteTexture(routeNum) {
  var c = document.createElement('canvas');
  c.width = 256; c.height = 96;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#111111';
  ctx.fillRect(0, 0, 256, 96);
  ctx.strokeStyle = '#FF8F00';
  ctx.lineWidth = 5;
  ctx.strokeRect(3, 3, 250, 90);
  if (routeNum) {
    ctx.fillStyle = '#FFCC00';
    ctx.font = 'bold 60px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(routeNum), 128, 50);
  }
  return new THREE.CanvasTexture(c);
}

/* ═══ BUS MODEL ═══ */
function makeBus(routeNum, busColor) {
  var bodyHex = 0x1565C0;
  if (typeof busColor === 'string' && busColor.startsWith('#'))
    bodyHex = parseInt(busColor.slice(1), 16);
  else if (typeof busColor === 'number')
    bodyHex = busColor;

  var g = new THREE.Group();
  // Dimensions
  var BL = 13.5, BW = 3.1;
  var YBOT = 0.08, YLH = 0.65, YBH = 2.55, WR = 0.5;
  var fY = YBOT + YLH;       // bottom of main colored body
  var YTOP = fY + YBH;       // top of main body

  var bMat   = new THREE.MeshLambertMaterial({ color: bodyHex });
  var roofM  = new THREE.MeshLambertMaterial({ color: 0xF0F0F0 });
  var glsM   = new THREE.MeshLambertMaterial({ color: 0x90CAF9, transparent: true, opacity: 0.5 });
  var dkM    = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  var chrM   = new THREE.MeshLambertMaterial({ color: 0xBDBDBD });
  var routeM = new THREE.MeshBasicMaterial({ map: makeRouteTexture(routeNum) });

  // — Lower dark skirt —
  var lower = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.16, YLH, BL), dkM);
  lower.position.set(0, YBOT + YLH / 2, 0); g.add(lower);

  // — Main colored body —
  var body = new THREE.Mesh(new THREE.BoxGeometry(BW, YBH, BL), bMat);
  body.position.set(0, fY + YBH / 2, 0); body.castShadow = true; g.add(body);

  // — White horizontal belt stripe —
  var stripe = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.02, 0.16, BL + 0.02), roofM);
  stripe.position.set(0, fY + YBH * 0.27, 0); g.add(stripe);

  // — White roof —
  var roof = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.1, 0.24, BL + 0.1), roofM);
  roof.position.set(0, YTOP + 0.12, 0); g.add(roof);

  // — AC unit on roof —
  var ac = new THREE.Mesh(new THREE.BoxGeometry(BW * 0.6, 0.28, BL * 0.38), new THREE.MeshLambertMaterial({ color: 0xcccccc }));
  ac.position.set(0, YTOP + 0.38, 0); g.add(ac);

  // — FRONT FACE —
  // Black lower mask
  var fMask = new THREE.Mesh(new THREE.BoxGeometry(BW, fY - YBOT + 0.4, 0.06), dkM);
  fMask.position.set(0, YBOT + (fY - YBOT + 0.4) / 2, -BL / 2 - 0.03); g.add(fMask);
  // Windshield
  var fWS = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.48, YBH * 0.56, 0.08), glsM);
  fWS.position.set(0, fY + YBH * 0.34, -BL / 2 - 0.04); g.add(fWS);
  // Destination / route board
  var fDest = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.38, 0.65, 0.07), routeM);
  fDest.position.set(0, YTOP - 0.34, -BL / 2 - 0.035); g.add(fDest);
  // Headlights + turn signals
  for (var hs = -1; hs <= 1; hs += 2) {
    var hl = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.25, 0.08), new THREE.MeshBasicMaterial({ color: 0xFFFDE7 }));
    hl.position.set(hs * (BW / 2 - 0.36), YBOT + YLH * 0.55, -BL / 2 - 0.04); g.add(hl);
    var sig = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.16, 0.06), new THREE.MeshBasicMaterial({ color: 0xFF8F00 }));
    sig.position.set(hs * (BW / 2 - 0.17), YBOT + YLH * 0.15, -BL / 2 - 0.03); g.add(sig);
  }
  // Front bumper
  var fBump = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.18, 0.28, 0.2), chrM);
  fBump.position.set(0, YBOT * 0.5, -BL / 2 - 0.1); g.add(fBump);

  // — REAR FACE —
  // Rear window
  var rWS = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.62, YBH * 0.42, 0.08), glsM);
  rWS.position.set(0, fY + YBH * 0.3, BL / 2 + 0.04); g.add(rWS);
  // Rear route number board
  var rDest = new THREE.Mesh(new THREE.BoxGeometry(BW - 0.38, 0.7, 0.07), routeM);
  rDest.position.set(0, YTOP - 0.37, BL / 2 + 0.035); g.add(rDest);
  // Taillights + reverse lights
  for (var ts = -1; ts <= 1; ts += 2) {
    var tl = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.5, 0.09), new THREE.MeshBasicMaterial({ color: 0xff1744 }));
    tl.position.set(ts * (BW / 2 - 0.33), YBOT + YLH * 0.5, BL / 2 + 0.045); g.add(tl);
    var rl = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.07), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    rl.position.set(ts * (BW / 2 - 0.14), YBOT + YLH * 0.12, BL / 2 + 0.035); g.add(rl);
  }
  // Rear bumper
  var rBump = new THREE.Mesh(new THREE.BoxGeometry(BW + 0.18, 0.28, 0.2), chrM);
  rBump.position.set(0, YBOT * 0.5, BL / 2 + 0.1); g.add(rBump);

  // — SIDE WINDOWS (6 per side) —
  var numW = 6, wZ0 = -BL / 2 + 2.5, wZ1 = BL / 2 - 1.0, wStp = (wZ1 - wZ0) / numW;
  for (var sd = -1; sd <= 1; sd += 2) {
    for (var wi = 0; wi < numW; wi++) {
      var wz = wZ0 + wi * wStp + wStp / 2;
      var win = new THREE.Mesh(new THREE.BoxGeometry(0.07, YBH * 0.45, wStp * 0.75), glsM);
      win.position.set(sd * (BW / 2 + 0.035), fY + YBH * 0.6, wz); g.add(win);
    }
  }

  // — PASSENGER DOOR (right side, near front) —
  var dgl = new THREE.Mesh(new THREE.BoxGeometry(0.07, YBH * 0.7, 1.8), glsM);
  dgl.position.set(BW / 2 + 0.035, fY + YBH * 0.42, -BL / 2 + 2.2); g.add(dgl);
  var dpil = new THREE.Mesh(new THREE.BoxGeometry(0.12, YBH * 0.72, 0.12), dkM);
  dpil.position.set(BW / 2 + 0.06, fY + YBH * 0.42, -BL / 2 + 3.15); g.add(dpil);

  // — WHEELS —
  var wG = new THREE.CylinderGeometry(WR, WR, 0.38, 14);
  var tirM = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  var hubM = new THREE.MeshLambertMaterial({ color: 0x757575 });
  var wPos = [
    [-BW / 2 - 0.19, WR, -BL / 2 + 1.7],
    [ BW / 2 + 0.19, WR, -BL / 2 + 1.7],
    [-BW / 2 - 0.19, WR,  BL / 2 - 1.9],
    [ BW / 2 + 0.19, WR,  BL / 2 - 1.9]
  ];
  var wheels = [];
  wPos.forEach(function(p) {
    var wh = new THREE.Mesh(wG, tirM);
    wh.rotation.z = Math.PI / 2; wh.position.set(p[0], p[1], p[2]);
    g.add(wh); wheels.push(wh);
    var hub = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.4, 8), hubM);
    hub.rotation.z = Math.PI / 2; hub.position.set(p[0], p[1], p[2]); g.add(hub);
  });

  // Exhaust pipe
  var exh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.5, 8), chrM);
  exh.rotation.z = Math.PI / 2;
  exh.position.set(-BW / 2 - 0.12, YBOT + 0.08, BL / 2 - 0.6); g.add(exh);

  g.userData.wheels = wheels;
  return g;
}

/* ═══ SCENERY FACTORIES ═══ */
function makeTree() {
  var g = new THREE.Group();
  var h = rand(3, 7);
  var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, h * 0.45, 6), new THREE.MeshLambertMaterial({ color: 0x6D4C41 }));
  trunk.position.set(0, h * 0.22, 0); g.add(trunk);
  var crown = new THREE.Mesh(new THREE.CylinderGeometry(0, rand(1.5, 3), h * 0.65, 7), new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(rand(0.25, 0.4), 0.7, rand(0.3, 0.5)) }));
  crown.position.set(0, h * 0.65, 0); g.add(crown);
  return g;
}

function makeBuilding() {
  var g = new THREE.Group();
  var h = rand(6, 22), w = rand(5, 12), d = rand(5, 10);
  var body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(rand(0, 1), rand(0.15, 0.5), rand(0.5, 0.75)) }));
  body.position.y = h / 2; body.castShadow = true; g.add(body);
  var winM = new THREE.MeshBasicMaterial({ color: 0xFFF9C4 });
  for (var wy = 2; wy < h - 1; wy += 2.2)
    for (var wx = -w / 2 + 1.2; wx < w / 2 - 0.5; wx += 1.8)
      if (Math.random() > 0.3) {
        var win = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.1), winM);
        win.position.set(wx, wy, d / 2 + 0.06); g.add(win);
      }
  return g;
}

function makePole() {
  var g = new THREE.Group();
  var p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 5, 6), new THREE.MeshLambertMaterial({ color: 0x78909C }));
  p1.position.set(0, 2.5, 0); g.add(p1);
  var p2 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 0.08), new THREE.MeshLambertMaterial({ color: 0x78909C }));
  p2.position.set(-0.9, 4.9, 0); g.add(p2);
  var p3 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 0.3), new THREE.MeshBasicMaterial({ color: 0xFFEE58 }));
  p3.position.set(-1.8, 4.8, 0); g.add(p3);
  return g;
}

function makeMarker() {
  var g = new THREE.Group();
  var m1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.0, 0.15), new THREE.MeshLambertMaterial({ color: 0xffffff }));
  m1.position.set(0, 0.5, 0); g.add(m1);
  var m2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, 0.18), new THREE.MeshBasicMaterial({ color: 0xff5722 }));
  m2.position.set(0, 0.85, 0); g.add(m2);
  return g;
}

/* ═══ INIT DRIVE GAME ═══ */
function initDriveGame(busData) {
  busData = busData || {};
  var routeNum = busData.route || '';
  var busColor = busData.color || '#1565C0';
  var el = document.getElementById('driveCanvas');
  var W = el.clientWidth, H = el.clientHeight;
  // Update start overlay title
  var titleEl = document.querySelector('#startOverlay .title');
  if (titleEl) titleEl.textContent = routeNum ? ('🚌 ' + routeNum + ' 路 驾驶员') : '🚌 公交车驾驶员';

  // Scene
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7EC8E3);
  scene.fog = new THREE.Fog(0x7EC8E3, 100, 380);

  var camera = new THREE.PerspectiveCamera(58, W / H, 0.5, 500);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  el.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  var sun = new THREE.DirectionalLight(0xffeedd, 1.0);
  sun.position.set(60, 120, -40); sun.castShadow = true;
  sun.shadow.camera.left = -80; sun.shadow.camera.right = 80;
  sun.shadow.camera.top = 80; sun.shadow.camera.bottom = -80;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x87CEEB, 0x558B2F, 0.35));

  // Ground
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: 0x558B2F }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);

  // Materials
  var roadMat = new THREE.MeshLambertMaterial({ color: 0x37474F });
  var swMat = new THREE.MeshLambertMaterial({ color: 0x9E9E9E });
  var curbMat = new THREE.MeshLambertMaterial({ color: 0xBDBDBD });
  var dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var edgeMat = new THREE.MeshBasicMaterial({ color: 0xFFD600 });

  // ── Road Tile Pool ──
  function makeTile() {
    var g = new THREE.Group();
    // road surface
    var surf = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W, 0.18, TILE_LEN), roadMat);
    surf.position.y = 0.09; surf.receiveShadow = true; g.add(surf);
    // sidewalks
    for (var s of [-1, 1]) {
      var sw = new THREE.Mesh(new THREE.BoxGeometry(SIDEWALK_W, 0.3, TILE_LEN), swMat);
      sw.position.set(s * (ROAD_W / 2 + SIDEWALK_W / 2), 0.15, 0); g.add(sw);
      var cu = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.4, TILE_LEN), curbMat);
      cu.position.set(s * (ROAD_W / 2 + 0.12), 0.2, 0); g.add(cu);
    }
    // center dashes
    for (var d = -TILE_LEN / 2 + 1; d < TILE_LEN / 2; d += 3) {
      var da = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 1.8), dashMat);
      da.position.set(0, 0.19, d); g.add(da);
    }
    // lane lines
    for (var lane of [-ROAD_W / 4, ROAD_W / 4]) {
      for (var d2 = -TILE_LEN / 2 + 2; d2 < TILE_LEN / 2; d2 += 4) {
        var ll = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.02, 1.2), dashMat);
        ll.position.set(lane, 0.19, d2); g.add(ll);
      }
    }
    // edge lines
    for (var es of [-1, 1]) {
      var ed = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.02, TILE_LEN), edgeMat);
      ed.position.set(es * (ROAD_W / 2 - 0.5), 0.19, 0); g.add(ed);
    }
    return g;
  }

  var tiles = [];
  var tileScenery = new Map();
  for (var i = 0; i < POOL; i++) {
    var t = makeTile();
    var wz = -(i - 10) * TILE_LEN;
    t.position.set(0, 0, wz);
    scene.add(t);
    tiles.push({ mesh: t, wz: wz });
  }

  // Scenery for a tile
  function spawnScenery(tile) {
    var objs = [];
    var z = tile.wz;
    // markers both sides
    for (var s of [-1, 1]) {
      var mk = makeMarker();
      mk.position.set(s * (ROAD_W / 2 + SIDEWALK_W + 0.5), 0, z);
      scene.add(mk); objs.push(mk);
    }
    // trees - DENSE, close to road
    for (var s2 of [-1, 1]) {
      // near tree
      if (Math.random() > 0.15) {
        var tr = makeTree();
        tr.position.set(s2 * (ROAD_W / 2 + SIDEWALK_W + rand(1.5, 6)), 0, z + rand(-5, 5));
        scene.add(tr); objs.push(tr);
      }
      // far tree
      if (Math.random() > 0.3) {
        var tr2 = makeTree();
        tr2.position.set(s2 * (ROAD_W / 2 + SIDEWALK_W + rand(7, 20)), 0, z + rand(-5, 5));
        scene.add(tr2); objs.push(tr2);
      }
    }
    // street lights every ~3 tiles
    if (Math.round(z / TILE_LEN) % 3 === 0) {
      for (var s3 of [-1, 1]) {
        var p = makePole();
        p.position.set(s3 * (ROAD_W / 2 + SIDEWALK_W - 0.3), 0, z);
        p.rotation.y = s3 < 0 ? 0 : Math.PI;
        scene.add(p); objs.push(p);
      }
    }
    // buildings
    for (var s4 of [-1, 1]) {
      if (Math.random() > 0.4) {
        var b = makeBuilding();
        b.position.set(s4 * (ROAD_W / 2 + SIDEWALK_W + rand(12, 35)), 0, z + rand(-4, 4));
        scene.add(b); objs.push(b);
      }
    }
    tileScenery.set(tile, objs);
  }

  function clearScenery(tile) {
    var objs = tileScenery.get(tile);
    if (objs) { objs.forEach(function(o) { scene.remove(o); }); tileScenery.delete(tile); }
  }

  // Initial scenery
  tiles.forEach(function(t) { spawnScenery(t); });

  // Fork visuals
  var forkGroup = null, forkActive = false, forkZ = 0, nextForkDist = 200;

  function spawnFork(z) {
    var fg = new THREE.Group();
    var bAngle = 0.4;
    for (var dir of [-1, 1]) {
      for (var i = 1; i <= 6; i++) {
        var seg = new THREE.Mesh(new THREE.BoxGeometry(ROAD_W * 0.7, 0.16, TILE_LEN * 0.8), roadMat);
        seg.position.set(dir * Math.sin(bAngle) * i * TILE_LEN * 0.7, 0.08,
          z - Math.cos(bAngle) * i * TILE_LEN * 0.7 - TILE_LEN);
        seg.rotation.y = -dir * bAngle;
        fg.add(seg);
      }
    }
    // road arrows
    for (var dir2 of [-1, 1]) {
      var arr = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.04, 3.5),
        new THREE.MeshBasicMaterial({ color: dir2 < 0 ? 0x4CAF50 : 0xFF9800 }));
      arr.position.set(dir2 * 2.8, 0.2, z + 5);
      arr.rotation.y = -dir2 * 0.2;
      fg.add(arr);
    }
    // sign post
    var sp = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 6, 6),
      new THREE.MeshLambertMaterial({ color: 0x555555 }));
    sp.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5, 3, z + 8);
    fg.add(sp);
    var board = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.2, 0.15),
      new THREE.MeshLambertMaterial({ color: 0x1565C0 }));
    board.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5, 5.5, z + 8);
    fg.add(board);
    // arrows on sign
    for (var dir3 of [-1, 1]) {
      var a = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 0.02),
        new THREE.MeshBasicMaterial({ color: dir3 < 0 ? 0x66BB6A : 0xFFA726 }));
      a.position.set(ROAD_W / 2 + SIDEWALK_W + 1.5 + dir3 * 0.5, 5.5 + dir3 * 0.25, z + 7.9);
      a.rotation.z = dir3 * 0.4;
      fg.add(a);
    }
    scene.add(fg);
    return fg;
  }

  // Bus
  var bus = makeBus(routeNum, busColor);
  scene.add(bus);

  // Clouds
  var cloudM = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
  for (var ci = 0; ci < 25; ci++) {
    var c = new THREE.Mesh(new THREE.SphereGeometry(rand(6, 18), 7, 5), cloudM);
    c.scale.set(rand(1, 3.5), 0.4, rand(0.8, 2));
    c.position.set(rand(-250, 250), rand(50, 90), rand(-200, 200));
    scene.add(c);
  }

  // ── Game State ──
  var G = { px: 0, pz: 0, heading: 0, speed: 0, dist: 0, keys: {},
    camPos: new THREE.Vector3(0, 9, 18) };

  // Touch state
  var touch = { steer: 0, gas: false, brake: false };

  // ── Keyboard Events ──
  var kd = function(e) {
    G.keys[e.key] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) !== -1) e.preventDefault();
  };
  var ku = function(e) { G.keys[e.key] = false; };
  window.addEventListener('keydown', kd);
  window.addEventListener('keyup', ku);

  // ── Resize ──
  var onR = function() {
    W = el.clientWidth; H = el.clientHeight;
    camera.aspect = W / H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  };
  window.addEventListener('resize', onR);

  // ── Touch Controls ──
  var touchCleanups = [];
  function setupTouchBtn(id, key, value, offValue) {
    var btn = document.getElementById(id);
    var setVal = function() { touch[key] = value; };
    var clearVal = function() { touch[key] = offValue; };
    var pdHandler = function(e) { e.preventDefault(); setVal(); };
    btn.addEventListener('pointerdown', pdHandler);
    btn.addEventListener('pointerup', clearVal);
    btn.addEventListener('pointerleave', clearVal);
    btn.addEventListener('pointercancel', clearVal);
    touchCleanups.push(function() {
      btn.removeEventListener('pointerdown', pdHandler);
      btn.removeEventListener('pointerup', clearVal);
      btn.removeEventListener('pointerleave', clearVal);
      btn.removeEventListener('pointercancel', clearVal);
    });
  }
  setupTouchBtn('btnGas', 'gas', true, false);
  setupTouchBtn('btnBrake', 'brake', true, false);
  setupTouchBtn('btnLeft', 'steer', 1, 0);
  setupTouchBtn('btnRight', 'steer', -1, 0);

  // ── HUD elements ──
  var hudSpeedEl = document.getElementById('hudSpeedVal');
  var hudDistEl = document.getElementById('hudDistVal');
  var hudForkEl = document.getElementById('hudFork');
  var hudSpeedBox = document.getElementById('hudSpeed');
  var hudDistBox = document.getElementById('hudDist');
  var touchControlsEl = document.getElementById('touchControls');
  var startOverlay = document.getElementById('startOverlay');
  var gameStarted = false;

  var startHandler = function() {
    gameStarted = true;
    startOverlay.style.display = 'none';
    hudSpeedBox.style.display = 'block';
    hudDistBox.style.display = 'block';
    touchControlsEl.style.display = 'flex';
  };
  document.getElementById('startDriveBtn').addEventListener('click', startHandler);

  // ── Game Loop ──
  var clock = new THREE.Clock();
  var animState = { raf: 0 };

  function loop() {
    animState.raf = requestAnimationFrame(loop);
    var dt = Math.min(clock.getDelta(), 0.05);

    // Speed
    if (G.keys['ArrowUp'] || G.keys['w'] || touch.gas) G.speed = Math.min(G.speed + 5 * dt, 3.2);
    else if (G.keys['ArrowDown'] || G.keys['s'] || touch.brake) G.speed = Math.max(G.speed - 7 * dt, -0.8);
    else G.speed += (1.4 - G.speed) * dt * 1.0;

    // Steer
    var st = 0;
    if (G.keys['ArrowLeft'] || G.keys['a']) st = 1;
    if (G.keys['ArrowRight'] || G.keys['d']) st = -1;
    if (touch.steer) st = touch.steer;
    G.heading += st * 2.2 * dt * Math.min(Math.abs(G.speed), 1.5);

    // Move
    G.px -= Math.sin(G.heading) * G.speed;
    G.pz -= Math.cos(G.heading) * G.speed;
    G.dist += Math.abs(G.speed) * dt * 30;

    // Bus
    bus.position.set(G.px, 0, G.pz);
    bus.rotation.y = G.heading;
    bus.userData.wheels.forEach(function(w) { w.rotation.x += G.speed * 0.4; });

    // ── Recycle tiles ──
    tiles.forEach(function(t) {
      var rel = t.wz - G.pz;
      if (rel > (POOL / 2) * TILE_LEN) {
        clearScenery(t);
        t.wz -= POOL * TILE_LEN;
        t.mesh.position.z = t.wz;
        t.mesh.position.x = 0;
        spawnScenery(t);
      } else if (rel < -(POOL / 2) * TILE_LEN) {
        clearScenery(t);
        t.wz += POOL * TILE_LEN;
        t.mesh.position.z = t.wz;
        t.mesh.position.x = 0;
        spawnScenery(t);
      }
    });

    // ── Fork ──
    nextForkDist -= Math.abs(G.speed) * dt * 30;
    var nearFork = false;
    if (nextForkDist <= 0 && !forkActive) {
      forkZ = G.pz - 80;
      forkGroup = spawnFork(forkZ);
      forkActive = true;
      nextForkDist = rand(250, 500);
    }
    if (forkActive && forkGroup) {
      var fd = G.pz - forkZ;
      nearFork = fd > -40 && fd < 15;
      if (fd < -30) {
        scene.remove(forkGroup); forkGroup = null; forkActive = false;
      }
    }

    // Camera
    var cd = 20, ch = 9;
    var ideal = new THREE.Vector3(
      G.px + Math.sin(G.heading) * cd, ch,
      G.pz + Math.cos(G.heading) * cd
    );
    G.camPos.lerp(ideal, 0.065);
    camera.position.copy(G.camPos);
    camera.lookAt(G.px - Math.sin(G.heading) * 14, 2, G.pz - Math.cos(G.heading) * 14);

    // Follow ground + sun
    ground.position.x = G.px; ground.position.z = G.pz;
    sun.position.set(G.px + 60, 120, G.pz - 40);
    sun.target.position.set(G.px, 0, G.pz);
    sun.target.updateMatrixWorld();

    // Update HUD
    hudSpeedEl.textContent = Math.abs(Math.round(G.speed * 32));
    hudDistEl.textContent = Math.round(G.dist);
    hudForkEl.style.display = nearFork ? 'block' : 'none';

    renderer.render(scene, camera);
  }
  loop();

  // ── Store state for cleanup ──
  driveState = {
    animState: animState,
    renderer: renderer,
    el: el,
    kd: kd,
    ku: ku,
    onR: onR,
    scene: scene,
    startHandler: startHandler,
    touchCleanups: touchCleanups
  };
}

/* ═══ DESTROY DRIVE GAME ═══ */
function destroyDriveGame() {
  if (!driveState) return;
  cancelAnimationFrame(driveState.animState.raf);
  window.removeEventListener('keydown', driveState.kd);
  window.removeEventListener('keyup', driveState.ku);
  window.removeEventListener('resize', driveState.onR);
  document.getElementById('startDriveBtn').removeEventListener('click', driveState.startHandler);
  driveState.touchCleanups.forEach(function(fn) { fn(); });
  if (driveState.el.contains(driveState.renderer.domElement)) {
    driveState.el.removeChild(driveState.renderer.domElement);
  }
  driveState.renderer.dispose();
  // Reset UI state for next entry
  var _tEl = document.querySelector('#startOverlay .title');
  if (_tEl) _tEl.textContent = '🚌 公交车驾驶员';
  document.getElementById('startOverlay').style.display = 'flex';
  document.getElementById('hudSpeed').style.display = 'none';
  document.getElementById('hudDist').style.display = 'none';
  document.getElementById('touchControls').style.display = 'none';
  document.getElementById('hudFork').style.display = 'none';
  driveState = null;
}
</script>
